<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />

  <!-- Sicherheit: strenge Content-Security-Policy für die App-Hülle.
       frame-src https: erlaubt das Anzeigen der Zielseite (sofern diese es zulässt) -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https:; base-uri 'none'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <meta name="theme-color" content="#0b0b12" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="muff1n" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <title>muff1n</title>
</head>
<body>
  <!-- animierter Hintergrund -->
  <div class="aurora" aria-hidden="true"></div>

  <!-- Kopfzeile -->
  <header class="bar" id="bar">
    <span class="brand">
      <span class="brand-mark">m<sup>1</sup></span>
      <span class="brand-name">muff1n</span>
    </span>
    <div class="bar-actions">
      <button id="reload" title="Neu laden" aria-label="Neu laden">⟳</button>
      <button id="open-ext" title="Im Browser öffnen" aria-label="Im Browser öffnen">↗</button>
    </div>
  </header>

  <!-- Streaming-Frame -->
  <main class="stage">
    <!-- sandbox OHNE allow-popups: blockiert die typischen Popup-/Popunder- und
         Auto-Weiterleitungs-Ads dieser Seiten. Player-relevante Rechte bleiben. -->
    <iframe id="frame"
            title="Stream"
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen
            referrerpolicy="strict-origin-when-cross-origin"
            sandbox="allow-scripts allow-same-origin allow-forms allow-presentation"></iframe>

    <!-- Ladeanzeige -->
    <div id="loader" class="loader">
      <div class="orb"></div>
      <p>Stream wird geladen …</p>
    </div>

    <!-- Hero / Fallback, falls die Seite das Einbetten blockiert -->
    <div id="fallback" class="hero hidden">
      <div class="glass">
        <div class="logo">m<sup>1</sup></div>
        <h1>muff1n</h1>
        <p class="tagline">Dein Stream, in einer App.</p>
        <p class="hint">Die Seite lässt sich gerade nicht direkt einbetten.
           Tippe, um sie zu öffnen:</p>
        <a id="launch" class="btn" href="#" target="_blank" rel="noopener noreferrer">
          ▶ &nbsp;Jetzt streamen
        </a>
        <button id="retry" class="btn-ghost">In der App neu versuchen</button>
        <span class="secure">🔒 Sichere App-Hülle · 🛡️ Popup-Ads blockiert · kein Tracking</span>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
