name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - claude/huhu-streaming-app-6ehti4
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Job 1: OHNE environment -> startet immer und aktiviert Pages per API.
  # Bricht das Henne-Ei-Problem: muss laufen, bevor das geschützte
  # github-pages-Environment im Deploy-Job greifen kann.
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup & enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  # Job 2: MIT environment -> deployt das in Job 1 hochgeladene Artefakt.
  deploy:
    needs: enable
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
